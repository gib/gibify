                justify-content: center;

                padding: 15px 30px;
                position: relative;
                transition: all 0.5s ease-in-out;

            nav:hover, nav:focus-within {
                background-color: rgba(255, 255, 255, 0.1);
                box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
            }
            a {
                border-radius: 15px;
                color: #fff;
                text-decoration: none;
            }
            a:focus, a:focus-visible {
                animation: outlinePulse .75s cubic-bezier(.4,0,.2,1) 0s 1;
                outline: 3px solid rgba(255,255,255,.75);
                outline-offset: 6px;
            }
            a:hover figcaption {
                color: rgba(255, 255, 255, 1);
                opacity: 1;
                transform: translateY(20px);
                transition-delay: 1s;
            }
            figcaption {
                border-radius: 15px;
                color: rgba(255, 255, 255, 0);
                left: 0;
                opacity: 0;
                padding: 20px;
                pointer-events: none;
                position: absolute;
                text-shadow: 2px 2px rgba(0, 0, 0, 0.3);
                transform: translateY(50%);
                transition: all 0.25s ease-in-out 0s;
            }

            svg {
                height: 30px;
                width: 30px;
                filter: drop-shadow(0px 0px rgba(0, 0, 0, 0.7));
                transition: all 0.5s ease-in-out;
            }
            a:hover svg, a:focus svg, a:focus-visible svg {
                filter: drop-shadow(0px -1px 1px rgba(0, 0, 0, .8));
